<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="hackernews-kotlin: Kotlin client for the official Hacker News API with a Compose reader" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1408"/>
      <stop offset="1" stop-color="#5A2200"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF7F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#120600" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="220" fill="#FF6600" opacity="0.10"/>
  <circle cx="60" cy="560" r="170" fill="#FF6600" opacity="0.08"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="80" y="112" width="44" height="44" rx="8" fill="#FF6600"/>
    <text x="102" y="145" fill="#FFFFFF" font-size="30" font-weight="800" text-anchor="middle">Y</text>
    <text x="140" y="143" fill="#FFB27A" font-size="20" font-weight="700" letter-spacing="3">KOTLIN · HACKER NEWS API</text>
    <text x="80" y="226" fill="#FFFFFF" font-size="58" font-weight="800">hackernews-kotlin</text>
    <text x="80" y="278" fill="#FFE3D1" font-size="25">Coroutine client for the Hacker News API,</text>
    <text x="80" y="312" fill="#FFE3D1" font-size="25">comment trees and a Compose reader.</text>
    <g font-size="16" font-weight="600">
      <rect x="80" y="358" width="112" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="136" y="383" fill="#FFFFFF" text-anchor="middle">Coroutines</text>
      <rect x="204" y="358" width="150" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="279" y="383" fill="#FFFFFF" text-anchor="middle">Sealed items</text>
      <rect x="366" y="358" width="156" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="444" y="383" fill="#FFFFFF" text-anchor="middle">Bounded paging</text>
      <rect x="80" y="410" width="152" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="156" y="435" fill="#FFFFFF" text-anchor="middle">Comment trees</text>
      <rect x="244" y="410" width="196" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="342" y="435" fill="#FFFFFF" text-anchor="middle">HTML → AnnotatedString</text>
      <rect x="452" y="410" width="130" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="517" y="435" fill="#FFFFFF" text-anchor="middle">Relative time</text>
    </g>
  </g>

  <!-- Reader card: a story list and a comment thread, drawn as placeholders. -->
  <g filter="url(#shadow)">
    <rect x="720" y="56" width="480" height="448" rx="32" fill="url(#card)"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="752" y="88" width="30" height="30" rx="6" fill="#FF6600"/>
    <text x="767" y="110" fill="#FFFFFF" font-size="20" font-weight="800" text-anchor="middle">Y</text>
    <text x="794" y="111" fill="#221A15" font-size="22" font-weight="800">Hacker News</text>
    <g font-size="13" font-weight="600">
      <rect x="752" y="132" width="56" height="28" rx="8" fill="#FFDBC9"/>
      <text x="780" y="151" fill="#341000" text-anchor="middle">Top</text>
      <rect x="816" y="132" width="56" height="28" rx="8" fill="none" stroke="#DDCBC1" stroke-width="1.5"/>
      <text x="844" y="151" fill="#53443C" text-anchor="middle">New</text>
      <rect x="880" y="132" width="56" height="28" rx="8" fill="none" stroke="#DDCBC1" stroke-width="1.5"/>
      <text x="908" y="151" fill="#53443C" text-anchor="middle">Best</text>
      <rect x="944" y="132" width="56" height="28" rx="8" fill="none" stroke="#DDCBC1" stroke-width="1.5"/>
      <text x="972" y="151" fill="#53443C" text-anchor="middle">Ask</text>
      <rect x="1008" y="132" width="60" height="28" rx="8" fill="none" stroke="#DDCBC1" stroke-width="1.5"/>
      <text x="1038" y="151" fill="#53443C" text-anchor="middle">Show</text>
    </g>
    <line x1="752" y1="174" x2="1168" y2="174" stroke="#EADBD2" stroke-width="1.5"/>

    <!-- Story rows -->
    <g font-size="15" font-weight="700" fill="#85736A">
      <text x="752" y="204">1.</text>
      <text x="752" y="262">2.</text>
    </g>
    <rect x="784" y="192" width="300" height="14" rx="7" fill="#3A2C25"/>
    <rect x="784" y="214" width="96" height="10" rx="5" fill="#E07A3A"/>
    <path d="M790 238 L796 228 L802 238 Z" fill="#FF6600"/>
    <rect x="808" y="230" width="200" height="9" rx="4.5" fill="#C9B8AE"/>
    <rect x="784" y="250" width="250" height="14" rx="7" fill="#3A2C25"/>
    <rect x="784" y="272" width="74" height="10" rx="5" fill="#E07A3A"/>
    <path d="M790 296 L796 286 L802 296 Z" fill="#FF6600"/>
    <rect x="808" y="288" width="170" height="9" rx="4.5" fill="#C9B8AE"/>
    <line x1="752" y1="314" x2="1168" y2="314" stroke="#EADBD2" stroke-width="1.5"/>

    <!-- Comment thread with depth lines -->
    <text x="752" y="342" fill="#221A15" font-size="15" font-weight="800">Discussion</text>
    <rect x="752" y="356" width="70" height="10" rx="5" fill="#221A15"/>
    <rect x="752" y="374" width="380" height="9" rx="4.5" fill="#B9A89E"/>
    <rect x="752" y="390" width="300" height="9" rx="4.5" fill="#B9A89E"/>
    <line x1="760" y1="412" x2="760" y2="488" stroke="#FF6600" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <rect x="776" y="414" width="62" height="10" rx="5" fill="#221A15"/>
    <rect x="776" y="432" width="340" height="9" rx="4.5" fill="#B9A89E"/>
    <line x1="784" y1="452" x2="784" y2="488" stroke="#3D8BFD" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <rect x="800" y="454" width="54" height="10" rx="5" fill="#221A15"/>
    <rect x="800" y="472" width="250" height="9" rx="4.5" fill="#B9A89E"/>
  </g>
</svg>
